[package]
name = "tx_sender_module"
version = "0.1.0"
edition = "2021"
description = "Logos tx_sender_module — the one EVM transaction sender: nonce ledger, one-approval call bundles through the signer manager, ordered broadcast, write-ahead history."
# Pin to the nix toolchain's rustc; resolver "3" then selects MSRV-compatible deps.
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Offline tx field math and address handling. No network and no signing here: eth_rpc talks
# to the chain, fee_module prices the gas, and the signer manager gets each call signed.
alloy = { version = "1", default-features = false, features = ["std", "sol-types"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# logos.wallets/1: the box each account's history is sealed in, under its key from the signer manager.
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "d8cfff84327c9b2b5cdb9702d1c4217cad567cee" }
# History file names: an HMAC of the address under the same key.
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

[dev-dependencies]
tempfile = "3"
